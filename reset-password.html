<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>استعادة كلمة المرور | بوابة أم كلثوم الذكية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script><style>*{box-sizing:border-box}body{font:16px Tahoma,Arial;background:#f4f7f6;color:#174f46;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);padding:28px;border-radius:18px;background:white;box-shadow:0 12px 36px #0001}img{width:100%;height:70px;object-fit:contain}label{display:block;margin-top:16px}input,button{width:100%;padding:13px;margin-top:8px;border:1px solid #ccd9d4;border-radius:9px;font:inherit}button{background:#174f46;color:white}p{line-height:1.7}a{color:#174f46}</style></head><body><main class="card"><img src="school-logo.png" alt="شعار مدرسة أم كلثوم"><h1>استعادة كلمة المرور</h1><p id="status" role="status">افتحي رابط استعادة كلمة المرور المرسل إلى بريدكِ.</p><form id="resetForm" hidden><label for="newPassword">كلمة المرور الجديدة (8 أحرف على الأقل)</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button id="savePassword">حفظ كلمة المرور</button></form><a href="login.html">العودة إلى تسجيل الدخول</a></main><script type="module" src="assets/js/reset-password.js"></script></body></html>
