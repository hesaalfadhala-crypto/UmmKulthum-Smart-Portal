<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحليل الشامل | بوابة أم كلثوم الذكية</title><link rel="stylesheet" href="assets/visits.css"><link rel="stylesheet" href="assets/report-fonts.css?v=20261019-cairo"><style>article.readonly,.weekly-plan,.read-only-preview{font-family:Cairo,Tahoma,Arial,sans-serif}</style></head><body><header><img src="school-logo.png" alt="وزارة التربية والتعليم ومدرسة أم كلثوم"><p>مدرسة أم كلثوم الابتدائية الإعدادية للبنات</p></header><main><nav aria-label="التنقل"><a href="index.html">البوابة الرئيسية</a><a href="visits.html">الزيارات الصفية</a><a href="visit-analysis.html">التحليل الشامل</a><span id="identity"></span></nav><h1>التحليل الشامل</h1><p id="status" class="status" role="status" aria-live="polite">جار التحقق من الحساب…</p><form id="filters" class="panel" hidden><div class="grid"><label>نطاق التحليل<select name="scope" id="scope"></select></label><label id="teacherLabel">المعلمة<select name="teacher_id" id="teacher"></select></label><label id="departmentLabel" hidden>القسم<select name="department" id="department"></select></label><label>تاريخ البداية<input name="from" type="date"></label><label>تاريخ النهاية<input name="to" type="date"></label><label>الفصل الدراسي<select name="semester"><option value="">الفصلان</option><option value="1">الأول</option><option value="2">الثاني</option></select></label><label>العام الدراسي<select name="academic_year" id="year"></select></label><label>نوع الزيارة<select name="visit_type" id="type"><option value="">جميع الأنواع</option></select></label><label>نوع التحليل<select id="analysisType"></select></label></div><details><summary>مقارنة زيارتين أو فترتين</summary><label>نوع المقارنة<select id="compareMode"><option value="">دون مقارنة</option><option value="periods">بين فترتين</option><option value="semesters">بين الفصلين الأول والثاني</option><option value="visits">بين زيارتين للمعلمة المختارة</option></select></label><p class="hint">مقارنة الفصلين تستخدم العام الدراسي المختار كاملًا. مقارنة زيارتين تستخدم الزيارتين المختارتين مباشرة.</p><div class="grid" id="compareDates" hidden><label>بداية الفترة الثانية<input id="fromB" type="date"></label><label>نهاية الفترة الثانية<input id="toB" type="date"></label></div><div class="grid" id="compareVisits" hidden><label>الزيارة الأولى<select id="visitA"></select></label><label>الزيارة الثانية<select id="visitB"></select></label></div></details><label>اسم المديرة المساعدة المشرفة عند الحاجة<input id="supervisor" maxlength="180"></label><div class="toolbar"><button id="run" type="submit" class="primary">عرض التحليل</button><button id="makeReport" type="button" disabled>حفظ وعرض التقرير</button></div></form><section id="results" class="panel" hidden></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script><script type="module" src="assets/js/visit-analysis-ui.js?v=20261019-cairo"></script></body></html>
